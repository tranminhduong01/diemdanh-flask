<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .card-header {
      background-color: #007bff;
      color: white;
      text-align: center;
      padding: 20px;
      border-bottom: none;
    }
    .card-body {
      padding: 25px;
    }
    .form-control {
      border-radius: 6px;
      padding: 10px 12px;
    }
    .input-group-text {
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-right: none;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      padding: 10px;
    }
    .btn-primary:hover {
      background-color: #0069d9;
    }
    .password-toggle {
      cursor: pointer;
      color: #6c757d;
    }
    .password-toggle:hover {
      color: #007bff;
    }
    .form-label {
      font-weight: 500;
      margin-bottom: 5px;
    }
    .password-strength {
      height: 5px;
      border-radius: 5px;
      margin-top: 5px;
      transition: all 0.3s;
      background-color: #e9ecef;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card">
          <div class="card-header">
            <h3 class="mb-1"><i class="fas fa-key me-2"></i>Đặt lại mật khẩu</h3>
            <p class="mb-0 mt-1" style="font-size:0.9rem;">Vui lòng tạo mật khẩu mới cho tài khoản của bạn</p>
          </div>
          <div class="card-body">
            <form id="resetPasswordForm">
              <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu mới</label>
                <div class="input-group">
                  <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu mới" required>
                  <span class="input-group-text password-toggle" id="togglePassword"><i class="fas fa-eye"></i></span>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
                <div class="form-text mt-1" style="font-size:0.8rem;">Mật khẩu tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                <div class="input-group">
                  <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                  <span class="input-group-text password-toggle" id="toggleConfirmPassword"><i class="fas fa-eye"></i></span>
                </div>
                <div class="invalid-feedback" id="passwordMatchError">Mật khẩu xác nhận không khớp.</div>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Xác nhận</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal thông báo thành công -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title text-success"><i class="fas fa-check-circle me-2"></i>Thành công</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body text-center">
          <p>Mật khẩu của bạn đã được đổi thành công!</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle mật khẩu
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId).querySelector('i');
      if(input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye','fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash','fa-eye');
      }
    }
    document.getElementById('togglePassword').addEventListener('click',()=>togglePassword('password','togglePassword'));
    document.getElementById('toggleConfirmPassword').addEventListener('click',()=>togglePassword('confirmPassword','toggleConfirmPassword'));

    // Kiểm tra password match
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const errorEl = document.getElementById('passwordMatchError');

    confirmInput.addEventListener('input', function(){
      if(passwordInput.value !== this.value && this.value.length>0){
        this.classList.add('is-invalid');
        errorEl.style.display = 'block';
      } else {
        this.classList.remove('is-invalid');
        errorEl.style.display = 'none';
      }
    });

    // Độ mạnh mật khẩu
    passwordInput.addEventListener('input', function(){
      const strengthBar = document.getElementById('passwordStrength');
      const pwd = this.value;
      let strength=0;
      if(pwd.length>=8) strength+=25;
      if(/[A-Z]/.test(pwd)) strength+=25;
      if(/[0-9]/.test(pwd)) strength+=25;
      if(/[^A-Za-z0-9]/.test(pwd)) strength+=25;

      strengthBar.style.width = strength+'%';
      if(strength<=25) strengthBar.style.backgroundColor='#dc3545';
      else if(strength<=50) strengthBar.style.backgroundColor='#fd7e14';
      else if(strength<=75) strengthBar.style.backgroundColor='#ffc107';
      else strengthBar.style.backgroundColor='#28a745';
    });

    // Submit form: hiển thị modal thành công
    document.getElementById('resetPasswordForm').addEventListener('submit', function(e){
      e.preventDefault();
      if(passwordInput.value !== confirmInput.value){
        confirmInput.classList.add('is-invalid');
        errorEl.style.display='block';
        return;
      }

      // Hiển thị modal thành công
      const successModal = new bootstrap.Modal(document.getElementById('successModal'));
      successModal.show();

      // Optionally: reset form sau khi đóng modal
      this.reset();
      document.getElementById('passwordStrength').style.width='0%';
    });
  </script>
</body>
</html>
