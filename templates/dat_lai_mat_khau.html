<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow p-4 col-md-6 mx-auto">
    <h3 class="text-center mb-3">🔁 Đặt lại mật khẩu</h3>
    <form method="POST">
      <label>Mật khẩu mới:</label>
      <input type="password" name="password" class="form-control mb-3" placeholder="Nhập mật khẩu mới" required>
      <button type="submit" class="btn btn-success w-100">Xác nhận</button>
    </form>
  </div>
</div>
</body>
</html>
