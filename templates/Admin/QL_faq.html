{% extends "menu_admin.html" %}
{% block content %}
<!-- Bootstrap CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="container mt-4">
    <h4 class="mb-4">📚 Quản lý Câu hỏi thường gặp (FAQ)</h4>

    <!-- Nút mở modal thêm FAQ -->
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
        <i class="fas fa-plus"></i> Thêm FAQ
    </button>

    <!-- Bảng danh sách FAQ -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Câu hỏi</th>
                        <th>Trả lời</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    {% for faq in faqs %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ faq.cau_hoi }}</td>
                        <td>{{ faq.cau_tra_loi[:100] }}...</td>
                        <td class="text-center">
                            <!-- Nút sửa -->
                            <button class="btn btn-sm btn-warning"
                                data-bs-toggle="modal"
                                data-bs-target="#editModal{{ faq.id }}">
                                <i class="fas fa-edit"></i>
                            </button>

                            <!-- Nút xóa -->
                            <form action="{{ url_for('faq_delete', id=faq.id) }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Bạn có chắc muốn xóa câu hỏi này?');">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- Modal Sửa FAQ -->
                    <div class="modal fade" id="editModal{{ faq.id }}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form action="{{ url_for('faq_edit', id=faq.id) }}" method="POST">
                                    <div class="modal-header bg-warning text-white">
                                        <h5 class="modal-title">Chỉnh sửa FAQ</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label">Câu hỏi</label>
                                            <input type="text" name="edit_cau_hoi" class="form-control" value="{{ faq.cau_hoi }}" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Câu trả lời</label>
                                            <textarea name="edit_cau_tra_loi" class="form-control" rows="4" required>{{ faq.cau_tra_loi }}</textarea>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-warning text-white">Lưu thay đổi</button>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm FAQ -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{{ url_for('faq_add') }}" method="POST">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Thêm FAQ mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Câu hỏi</label>
                        <input type="text" name="cau_hoi" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Câu trả lời</label>
                        <textarea name="cau_tra_loi" class="form-control" rows="4" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
