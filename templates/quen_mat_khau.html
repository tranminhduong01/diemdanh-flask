<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow p-4 col-md-6 mx-auto">
    <h3 class="text-center mb-3">🔑 Quên mật khẩu</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{category}}">{{message}}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label>Email:</label>
      <input type="email" name="email" class="form-control mb-3" placeholder="Nhập email của bạn" required>
      <button type="submit" class="btn btn-primary w-100">Gửi yêu cầu đặt lại</button>
    </form>
  </div>
</div>
</body>
</html>
