<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông báo của bạn</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .notification {
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .unread {
            background-color: #eef7ff;
            font-weight: bold;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>📢 Thông báo của bạn</h2>

    {% for n in notifications %}
    <div class="notification {% if not n.is_read %}unread{% endif %}">
        <h4>{{ n.title }}</h4>
        <p>{{ n.message }}</p>
        <small>{{ n.created_at }}</small><br>
        {% if not n.is_read %}
        <button onclick="markRead({{ n.id }})">Đánh dấu đã đọc</button>
        {% else %}
        <i>Đã đọc</i>
        {% endif %}
    </div>
    {% endfor %}

    <script>
        function markRead(id) {
            fetch(`/notifications/read/${id}`, { method: 'PUT' })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                location.reload();
            });
        }
    </script>
</body>
</html>
