<!-- Chatbot Widget -->
<button id="chat-button">💬 Chat với AI</button>

<div id="chat-box">
  <div id="chat-header">
    <span>Trợ lý AI</span>
    <button id="close-chat">✖</button>
  </div>

  <div id="chat-messages"></div>

  <div id="chat-input">
    <input id="msg" type="text" placeholder="Nhập tin nhắn...">
    <button id="send-btn">Gửi</button>
  </div>
</div>

<style>
  #chat-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #0076ff;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 9999;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  #chat-box {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 320px;
    height: 420px;
    background: white;
    border-radius: 10px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    border: 1px solid #dce6f6;
  }

  #chat-header {
    background: #0076ff;
    color: white;
    padding: 10px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #chat-header #close-chat {
    background: transparent;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 16px;
  }

  #chat-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    font-size: 14px;
  }

  .user-msg, .ai-msg {
    margin-bottom: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    max-width: 85%;
    line-height: 1.3;
  }

  .user-msg {
    background: #e1f0ff;
    align-self: flex-end;
  }

  .ai-msg {
    background: #f5f5f5;
    border-left: 3px solid #0076ff;
  }

  #chat-input {
    display: flex;
    border-top: 1px solid #ddd;
  }

  #chat-input input {
    flex: 1;
    border: none;
    padding: 10px;
    font-size: 14px;
  }

  #chat-input button {
    background: #0076ff;
    color: white;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
  }

  /* Hiệu ứng typing */
  .typing {
    display: inline-block;
    font-size: 14px;
  }
  .typing::after {
    content: "…";
    animation: dots 1s steps(3) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    33% { content: "."; }
    66% { content: ".."; }
    100% { content: "..."; }
  }
</style>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>
  const socket = io();
  const chatBox = document.getElementById("chat-box");
  const chatMessages = document.getElementById("chat-messages");
  const msgInput = document.getElementById("msg");

  document.getElementById("chat-button").onclick = () => {
    chatBox.style.display = (chatBox.style.display === "flex") ? "none" : "flex";
  };

  document.getElementById("close-chat").onclick = () => {
    chatBox.style.display = "none";
  };

  document.getElementById("send-btn").onclick = sendMessage;
  msgInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

  function sendMessage() {
    const msg = msgInput.value.trim();
    if (!msg) return;

    chatMessages.innerHTML += `<div class="user-msg">${msg}</div>`;
    chatMessages.scrollTop = chatMessages.scrollHeight;

    msgInput.value = "";

    // Hiển thị hiệu ứng đang trả lời
    const typing = document.createElement("div");
    typing.className = "ai-msg typing";
    typing.id = "typing";
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    socket.emit("send_message", { user: "Sinh viên", message: msg });
  }

  socket.on("receive_message", data => {
    document.getElementById("typing")?.remove();
    chatMessages.innerHTML += `<div class="ai-msg">${data.response}</div>`;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
</script>
