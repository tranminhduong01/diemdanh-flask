<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý điểm danh - {{ lop.class_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
        }

        .class-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .class-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .session-card {
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .session-header {
            padding: 1rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .session-header:hover {
            background-color: #f8f9fa;
        }

        .session-info {
            display: flex;
            align-items: center;
        }

        .session-number {
            font-weight: 600;
            margin-right: 1rem;
        }

        .session-date {
            color: #6c757d;
            margin-right: 1rem;
        }

        .session-time {
            color: #6c757d;
            font-size: 0.875rem;
        }

        .student-list {
            padding: 1rem;
            display: none;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 0.75rem;
            text-align: center;
        }

        .stat-count {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6c757d;
        }

        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .table-responsive {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }

        .btn-toggle {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        .btn-toggle:hover {
            background-color: #0b5ed7;
        }

        .btn-toggle.active {
            background-color: #6c757d;
        }

        .form-select-sm {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
        }

        @media (max-width: 768px) {
            .session-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .session-info {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 0.5rem;
            }

            .session-number, .session-date, .session-time {
                margin-right: 0;
                margin-bottom: 0.25rem;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <!-- Nút Quay lại bên trái -->
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm me-3">
                        <i class="fas fa-arrow-left me-1"></i> Quay lại
                    </a>
                    <!-- Tiêu đề -->
                    <div>
                        <h1 class="class-title">Quản lý điểm danh</h1>
                        <p class="class-subtitle">{{ lop.class_name }}</p>
                    </div>
                </div>
                <!-- Nút Xuất Excel bên phải -->
                <button class="btn btn-success" onclick="exportExcel({{ class_id }})">
                    Xuất Excel danh sách lớp
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="session-list">
            {% for s in sessions %}
            <div class="session-card" data-session-id="{{ s.id }}">
                <div class="session-header">
                    <div class="session-info">
                        <span class="session-number">Buổi {{ s.session_number }}</span>
                        <span class="session-date">{{ s.date }}</span>
                        <span class="session-time"><i class="far fa-clock me-1"></i>{{ s.start_time }} - {{ s.end_time }}</span>
                    </div>
                    <button class="btn-toggle">
                        <i class="fas fa-users me-1"></i>Xem sinh viên
                    </button>
                </div>

                <div class="student-list">
                    <!-- Nội dung danh sách sinh viên sẽ được thêm ở đây -->
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function exportExcel(classId) {
            window.location.href = `/export_excel/${classId}`;
        }
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".btn-toggle").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const sessionCard = btn.closest(".session-card");
                    const studentListDiv = sessionCard.querySelector(".student-list");
                    const sessionId = sessionCard.dataset.sessionId;
                    const icon = btn.querySelector("i");

                    // Toggle hiển thị
                    if (studentListDiv.style.display === "block") {
                        studentListDiv.style.display = "none";
                        btn.classList.remove("active");
                        icon.className = "fas fa-users me-1";
                        btn.innerHTML = '<i class="fas fa-users me-1"></i>Xem sinh viên';
                        return;
                    }

                    // Hiển thị trạng thái loading
                    studentListDiv.innerHTML = `
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Đang tải dữ liệu...</p>
                        </div>
                    `;
                    studentListDiv.style.display = "block";

                    // Thay đổi trạng thái nút
                    btn.classList.add("active");
                    icon.className = "fas fa-spinner fa-spin me-1";
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Đang tải...';

                    try {
                        // Gọi API lấy danh sách sinh viên
                        const res = await fetch(`/api/buoi_hoc/${sessionId}/sinhvien`);
                        const data = await res.json();

                        // Đếm số lượng theo trạng thái - SỬA LẠI Ở ĐÂY
                        let counts = {
                            "Có mặt": 0,
                            "Đi trễ": 0,
                            "Vắng có phép": 0,
                            "Vắng không phép": 0,
                            "Chưa điểm danh": 0
                        };

                        data.forEach(st => {
                            // Đếm dựa trên status_in
                            switch(st.status_in) {
                                case "present":
                                    counts["Có mặt"]++;
                                    break;
                                case "late":
                                    counts["Đi trễ"]++;
                                    break;
                                case "absent_excused":
                                    counts["Vắng có phép"]++;
                                    break;
                                case "absent_unexcused":
                                    counts["Vắng không phép"]++;
                                    break;
                                default:
                                    counts["Chưa điểm danh"]++;
                                    break;
                            }
                        });

                        // Render thống kê + danh sách
                        let html = `
                            <div class="stats-container">
                                <div class="stat-item">
                                    <div class="stat-count">${counts["Có mặt"]}</div>
                                    <div class="stat-label">Có mặt</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-count">${counts["Đi trễ"]}</div>
                                    <div class="stat-label">Đi trễ</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-count">${counts["Vắng có phép"]}</div>
                                    <div class="stat-label">Vắng có phép</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-count">${counts["Vắng không phép"]}</div>
                                    <div class="stat-label">Vắng không phép</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-count">${counts["Chưa điểm danh"]}</div>
                                    <div class="stat-label">Chưa điểm danh</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-count">${data.length}</div>
                                    <div class="stat-label">Tổng số</div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>MSSV</th>
                                            <th>Họ tên</th>
                                            <th>Ngày</th>
                                            <th>Trạng thái vào</th>
                                            <th>Giờ vào</th>
                                            <th>Trạng thái ra</th>
                                            <th>Giờ ra</th>
                                            <th>Điểm</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;

                        data.forEach(st => {
                            html += `
                                <tr>
                                    <td>${st.mssv}</td>
                                    <td>${st.full_name}</td>
                                    <td>${st.date}</td>
                                    <td>
                                      <select class="form-select form-select-sm status-in-select" data-id="${st.enrollment_id}" data-session="${sessionId}">
                                        <option value="none" ${st.status_in === "none" || !st.status_in ? "selected" : ""}>Không xác định</option>
                                        <option value="present" ${st.status_in === "present" ? "selected" : ""}>Có mặt</option>
                                        <option value="late" ${st.status_in === "late" ? "selected" : ""}>Đi trễ</option>
                                        <option value="absent_excused" ${st.status_in === "absent_excused" ? "selected" : ""}>Vắng có phép</option>
                                        <option value="absent_unexcused" ${st.status_in === "absent_unexcused" ? "selected" : ""}>Vắng không phép</option>
                                      </select>
                                    </td>
                                    <td>${st.time_in || ''}</td>
                                    <td>
                                      <select class="form-select form-select-sm status-out-select" data-id="${st.enrollment_id}" data-session="${sessionId}">
                                        <option value="checked_out" ${st.status_out === "checked_out" ? "selected" : ""}>Đã ra</option>
                                        <option value="not_checked_out" ${st.status_out === "not_checked_out" ? "selected" : ""}>Chưa ra</option>
                                      </select>
                                    </td>
                                    <td>${st.time_out || ''}</td>
                                    <td>${st.score || ''}</td>
                                </tr>
                            `;
                        });

                        html += `</tbody></table></div>`;

                        studentListDiv.innerHTML = html;

                        // Gắn sự kiện sau khi render danh sách
                        studentListDiv.querySelectorAll(".status-in-select, .status-out-select").forEach(select => {
                          select.addEventListener("change", async (e) => {
                            const selectElem = e.target;
                            const enrollmentId = selectElem.dataset.id;
                            const sessionId = selectElem.dataset.session;
                            const newStatus = selectElem.value;
                            const isStatusIn = selectElem.classList.contains("status-in-select");

                            try {
                              const res = await fetch(`/api/diemdanh/thaydoi`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                  enrollment_id: enrollmentId,
                                  session_id: sessionId,
                                  field: isStatusIn ? "status_in" : "status_out",
                                  value: newStatus
                                })
                              });

                              const result = await res.json();
                              if (!result.success) throw new Error(result.error || "Lỗi cập nhật trạng thái");

                              // Hiện thông báo thành công
                              Swal.fire({
                                    toast: true,
                                    position: "top-end",
                                    icon: "success",
                                    title: "Cập nhật trạng thái thành công!",
                                    showConfirmButton: false,
                                    timer: 800,
                                    timerProgressBar: true
                                }).then(() => {
                                    location.reload();
                                });

                              // Cập nhật lại thống kê sau khi thay đổi
                              if (isStatusIn) {
                                // Tìm hàng chứa select box này
                                const row = selectElem.closest('tr');
                                // Có thể cập nhật lại thống kê ở đây nếu cần
                              }

                            } catch (err) {
                              Swal.fire({
                                icon: "error",
                                title: "Oops...",
                                text: "Có lỗi xảy ra: " + err.message,
                                confirmButtonText: "Đóng"
                              });

                            }
                          });
                        });

                        // Cập nhật lại nút
                        btn.classList.remove("active");
                        icon.className = "fas fa-times me-1";
                        btn.innerHTML = '<i class="fas fa-times me-1"></i>Ẩn sinh viên';

                    } catch (error) {
                        console.error("Lỗi khi tải dữ liệu:", error);
                        studentListDiv.innerHTML = `
                            <div class="alert alert-danger text-center" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Đã xảy ra lỗi khi tải dữ liệu. Vui lòng thử lại.
                            </div>
                        `;

                        // Khôi phục nút về trạng thái ban đầu
                        btn.classList.remove("active");
                        icon.className = "fas fa-users me-1";
                        btn.innerHTML = '<i class="fas fa-users me-1"></i>Xem sinh viên';
                    }
                });
            });
        });
    </script>
</body>
</html>
