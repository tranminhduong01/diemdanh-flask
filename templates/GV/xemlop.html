<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý điểm danh - {{ lop.class_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --light-bg: #f8f9fc;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #2a3e9d 100%);
            color: white;
            padding: 1.5rem 0;
            border-radius: 0 0 15px 15px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .session-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.2);
        }

        .session-header {
            background-color: white;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e3e6f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-body {
            padding: 1.5rem;
            background-color: white;
        }

        .session-footer {
            background-color: #f8f9fc;
            padding: 0.75rem 1.5rem;
            border-top: 1px solid #e3e6f0;
            display: flex;
            justify-content: flex-end;
        }

        .badge-status {
            font-size: 0.85rem;
            padding: 0.35rem 0.65rem;
            border-radius: 0.35rem;
        }

        .student-list {
            background-color: #f8f9fc;
            border-radius: 10px;
            padding: 1.5rem;
            margin-top: 1rem;
            display: none;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            flex: 1;
            min-width: 120px;
            margin: 0 0.25rem;
        }

        .stat-count {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .btn-toggle {
            border-radius: 50px;
            padding: 0.375rem 1.2rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-toggle i {
            margin-right: 0.5rem;
        }

        .table th {
            border-top: none;
            font-weight: 600;
            color: var(--secondary-color);
            background-color: #f8f9fc;
        }

        .session-number {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .session-date {
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        .session-time {
            background-color: #eaecf4;
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .stats-container {
                flex-direction: column;
            }

            .stat-item {
                margin-bottom: 0.5rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h3 mb-0"><i class="fas fa-chalkboard-teacher me-2"></i>Quản lý điểm danh</h1>
                <a href="javascript:history.back()" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <div class="card session-card">
                    <div class="card-body text-center py-4">
                        <h2 class="h4">{{ lop.class_name }}</h2>
                        <p class="text-muted mb-0">Theo dõi điểm danh các buổi học</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="session-list">
            {% for s in sessions %}
            <div class="session-card card" data-session-id="{{ s.id }}">
                <div class="session-header">
                    <div>
                        <span class="session-number">Buổi {{ s.session_number }}</span>
                        <span class="session-date ms-2">{{ s.date }}</span>
                        <div class="session-time">
                            <i class="far fa-clock me-1"></i>{{ s.start_time }} - {{ s.end_time }}
                        </div>
                    </div>
                    <div class="session-actions">
                        <button class="btn btn-primary btn-toggle btn-xem-sinhvien">
                            <i class="fas fa-users"></i>Xem sinh viên
                        </button>
                    </div>
                </div>

                <div class="student-list">
                    <!-- Nội dung danh sách sinh viên sẽ được thêm ở đây -->
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".btn-xem-sinhvien").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const sessionCard = btn.closest(".session-card");
                    const studentListDiv = sessionCard.querySelector(".student-list");
                    const sessionId = sessionCard.dataset.sessionId;
                    const icon = btn.querySelector("i");

                    // Toggle hiển thị
                    if (studentListDiv.style.display === "block") {
                        studentListDiv.style.display = "none";
                        btn.classList.remove("btn-secondary");
                        btn.classList.add("btn-primary");
                        icon.className = "fas fa-users";
                        btn.innerHTML = '<i class="fas fa-users"></i>Xem sinh viên';
                        return;
                    }

                    // Hiển thị trạng thái loading
                    studentListDiv.innerHTML = `
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Đang tải dữ liệu...</p>
                        </div>
                    `;
                    studentListDiv.style.display = "block";

                    // Thay đổi trạng thái nút
                    btn.classList.remove("btn-primary");
                    btn.classList.add("btn-secondary");
                    icon.className = "fas fa-spinner fa-spin";
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>Đang tải...';

                    try {
                        // Gọi API lấy danh sách sinh viên
                        const res = await fetch(`/api/buoi_hoc/${sessionId}/sinhvien`);
                        const data = await res.json();

                        // Đếm số lượng theo trạng thái
                        let counts = {
                            "Có mặt": 0,
                            "Đi trễ": 0,
                            "Vắng có phép": 0,
                            "Vắng không phép": 0,
                            "Chưa điểm danh": 0
                        };
                        console.log("📋 Dữ liệu sinh viên:", data);

                        data.forEach(st => {
                            if (counts[st.status] !== undefined) counts[st.status]++;
                        });

                        // Render thống kê + danh sách
                        let html = `
                            <div class="stats-container">
                                <div class="stat-item" style="background-color: rgba(28, 200, 138, 0.2); color: #1cc88a;">
                                    <div class="stat-count">${counts["Có mặt"]}</div>
                                    <div class="stat-label">Có mặt</div>
                                </div>
                                <div class="stat-item" style="background-color: rgba(246, 194, 62, 0.2); color: #f6c23e;">
                                    <div class="stat-count">${counts["Đi trễ"]}</div>
                                    <div class="stat-label">Đi trễ</div>
                                </div>
                                <div class="stat-item" style="background-color: rgba(54, 185, 204, 0.2); color: #36b9cc;">
                                    <div class="stat-count">${counts["Vắng có phép"]}</div>
                                    <div class="stat-label">Vắng có phép</div>
                                </div>
                                <div class="stat-item" style="background-color: rgba(231, 74, 59, 0.2); color: #e74a3b;">
                                    <div class="stat-count">${counts["Vắng không phép"]}</div>
                                    <div class="stat-label">Vắng không phép</div>
                                </div>
                                <div class="stat-item" style="background-color: rgba(133, 135, 150, 0.2); color: #858796;">
                                    <div class="stat-count">${counts["Chưa điểm danh"]}</div>
                                    <div class="stat-label">Chưa điểm danh</div>
                                </div>
                                <div class="stat-item" style="background-color: rgba(78, 115, 223, 0.2); color: #4e73df;">
                                    <div class="stat-count">${data.length}</div>
                                    <div class="stat-label">Tổng số</div>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>MSSV</th>
                                            <th>Họ tên</th>
                                            <th>Ngày</th>
                                            <th>Trạng thái vào</th>
                                            <th>Giờ vào</th>
                                            <th>Trạng thái ra</th>
                                            <th>Giờ ra</th>
                                            <th>Điểm</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;

                        data.forEach(st => {
                        let badgeIn = "secondary";
                        let badgeOut = "secondary";

                        // Mapping trạng thái vào
                        if (st.status_in === "present") badgeIn = "success";
                        else if (st.status_in === "late") badgeIn = "warning";
                        else if (st.status_in === "absent_excused") badgeIn = "info";
                        else if (st.status_in === "absent_unexcused") badgeIn = "danger";

                        // Mapping trạng thái ra
                        if (st.status_out === "checked_out") badgeOut = "success";
                        else badgeOut = "secondary";

                        html += `
                            <tr>
                                <td>${st.mssv}</td>
                                <td>${st.full_name}</td>
                                <td>${st.date}</td>
                                <td>
                                  <select class="form-select form-select-sm status-in-select" data-id="${st.enrollment_id}" data-session="${sessionId}">
                                    <option value="present" ${st.status_in === "present" ? "selected" : ""}>Có mặt</option>
                                    <option value="late" ${st.status_in === "late" ? "selected" : ""}>Đi trễ</option>
                                    <option value="absent_excused" ${st.status_in === "absent_excused" ? "selected" : ""}>Vắng có phép</option>
                                    <option value="absent_unexcused" ${st.status_in === "absent_unexcused" ? "selected" : ""}>Vắng không phép</option>
                                  </select>
                                </td>
                                <td>${st.time_in}</td>
                                <td>
                                  <select class="form-select form-select-sm status-out-select" data-id="${st.enrollment_id}" data-session="${sessionId}">
                                    <option value="checked_out" ${st.status_out === "checked_out" ? "selected" : ""}>Đã ra</option>
                                    <option value="not_checked_out" ${st.status_out === "not_checked_out" ? "selected" : ""}>Chưa ra</option>
                                  </select>
                                </td>
                                <td>${st.time_out}</td>
                                <td>${st.score}</td>
                            </tr>
                        `;
                    });


                        html += `</tbody></table></div>`;

                        studentListDiv.innerHTML = html;

                        // Gắn sự kiện sau khi render danh sách
                        studentListDiv.querySelectorAll(".status-in-select, .status-out-select").forEach(select => {
                          select.addEventListener("change", async (e) => {
                            const selectElem = e.target;
                            const enrollmentId = selectElem.dataset.id;
                            const sessionId = selectElem.dataset.session;
                            const newStatus = selectElem.value;
                            const isStatusIn = selectElem.classList.contains("status-in-select");

                            console.log("🔍 Debug gửi API:", {
                              enrollmentId, sessionId, field: isStatusIn ? "status_in" : "status_out", value: newStatus
                            });

                            try {
                              const res = await fetch(`/api/diemdanh/thaydoi`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                  enrollment_id: enrollmentId,
                                  session_id: sessionId,
                                  field: isStatusIn ? "status_in" : "status_out",
                                  value: newStatus
                                })
                              });

                              const result = await res.json();
                              if (!result.success) throw new Error(result.error || "Lỗi cập nhật trạng thái");

                              // ✅ Hiện toast đẹp
                              Swal.fire({
                                toast: true,
                                position: "top-end",
                                icon: "success",
                                title: "Cập nhật trạng thái thành công!",
                                showConfirmButton: false,
                                timer: 2000,
                                timerProgressBar: true
                              });
                            } catch (err) {
                              Swal.fire({
                                icon: "error",
                                title: "Oops...",
                                text: "Có lỗi xảy ra: " + err.message,
                                confirmButtonText: "Đóng"
                              });
                            }
                          });
                        });


                        // Cập nhật lại nút
                        btn.classList.remove("btn-secondary");
                        btn.classList.add("btn-primary");
                        icon.className = "fas fa-times";
                        btn.innerHTML = '<i class="fas fa-times"></i>Ẩn sinh viên';


                    } catch (error) {
                        studentListDiv.innerHTML = `
                            <div class="alert alert-danger text-center" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Đã xảy ra lỗi khi tải dữ liệu. Vui lòng thử lại.
                            </div>
                        `;

                        // Khôi phục nút về trạng thái ban đầu
                        btn.classList.remove("btn-secondary");
                        btn.classList.add("btn-primary");
                        icon.className = "fas fa-users";
                        btn.innerHTML = '<i class="fas fa-users"></i>Xem sinh viên';
                    }
                });
            });
        });

    </script>
</body>
</html>
